name: Build RPM and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rpm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build, test, and install RPM on Fedora 44
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e GITHUB_REF_TYPE -e GITHUB_REF_NAME \
            registry.fedoraproject.org/fedora:44 bash packaging/ci.sh
      - uses: actions/upload-artifact@v4
        with:
          name: md-pad-rpm
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: rpm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: md-pad-rpm
          path: dist
      - name: Publish release with RPM, source RPM, and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag \
              --title "Pad $RELEASE_TAG" --notes-file CHANGELOG.md
          fi
